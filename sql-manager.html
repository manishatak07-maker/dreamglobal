<!DOCTYPE html>
<html>
<head>
    <title>SQL Manager - Santra Mall</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: Arial; }
        body { background: #f5f5f5; }
        .header { background: #e91e63; color: white; padding: 15px; font-size: 20px; font-weight: bold; }
        .container { padding: 20px; max-width: 1200px; margin: auto; }
        .box { background: white; padding: 20px; border-radius: 10px; margin-bottom: 20px; }
        .btn { padding: 10px 20px; border: none; border-radius: 5px; cursor: pointer; margin: 5px; color: white; font-weight: bold; }
        .blue { background: #3b82f6; }
        .green { background: #10b981; }
        .red { background: #ef4444; }
        .orange { background: #f59e0b; }
        textarea { width: 100%; height: 120px; background: #1e293b; color: #10b981; padding: 15px; border-radius: 5px; font-family: monospace; margin: 10px 0; }
        .result { background: #1e293b; color: #10b981; padding: 15px; border-radius: 5px; min-height: 100px; font-family: monospace; }
    </style>
</head>
<body>
    <div class="header">🛡️ SANTRA MALL - SQL Database</div>
    <div class="container">
        <div class="box">
            <h2>🗄️ SQL Database Manager</h2>
            <button class="btn blue">📦 Products</button>
            <button class="btn blue">📋 Orders</button>
            <button class="btn blue">👥 Users</button>
        </div>

        <div class="box">
            <h3>🔍 SQL Query Console</h3>
            <textarea id="query">SELECT * FROM products</textarea>
            <button class="btn green" onclick="runQuery()">▶ Execute Query</button>
            <button class="btn red" onclick="clearQuery()">🗑️ Clear</button>
            
            <h3 style="margin-top: 20px;">📊 Query Result</h3>
            <div class="result" id="result">Welcome to SANTRA SQL Console</div>
        </div>

        <div class="box">
            <h3>💾 Database Backup/Restore</h3>
            <button class="btn blue">📥 Download Backup</button>
            <button class="btn orange">📤 Restore Backup</button>
            <button class="btn red">🗑️ Reset All Data</button>
        </div>
    </div>
    <script>
        function runQuery() {
            document.getElementById('result').innerText = 'Query executed successfully!\n\n[Demo Data: 5 products found]';
        }
        function clearQuery() {
            document.getElementById('query').value = '';
            document.getElementById('result').innerText = 'Welcome to SANTRA SQL Console';
        }
    </script>
</body>
</html>
