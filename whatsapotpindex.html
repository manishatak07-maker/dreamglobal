<!DOCTYPE html>
<html>
<head>
    <title>WhatsApp OTP Login - SANTRA MALL</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: Arial, sans-serif; }
        body { background: linear-gradient(135deg, #25d366 0%, #128c7e 100%); min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 20px; }
        .login-box { background: white; padding: 30px; border-radius: 15px; box-shadow: 0 10px 40px rgba(0,0,0,0.2); max-width: 400px; width: 100%; }
        h2 { text-align: center; color: #25d366; margin-bottom: 10px; }
        .subtitle { text-align: center; color: #666; margin-bottom: 25px; font-size: 14px; }
        input { width: 100%; padding: 15px; margin: 10px 0; border: 2px solid #ddd; border-radius: 8px; font-size: 16px; }
        input:focus { outline: none; border-color: #25d366; }
        .btn { width: 100%; padding: 15px; border: none; border-radius: 8px; font-size: 16px; font-weight: bold; cursor: pointer; margin: 8px 0; }
        .btn-whatsapp { background: #25d366; color: white; }
        .btn-whatsapp:hover { background: #128c7e; }
        .btn-verify { background: #e91e63; color: white; }
        .btn-verify:hover { background: #c2185b; }
        .btn-back { background: #666; color: white; }
        .note { background: #fff3cd; padding: 12px; border-radius: 8px; font-size: 13px; color: #856404; margin: 15px 0; border-left: 4px solid #ffc107; }
        .success { background: #d4edda; color: #155724; padding: 15px; border-radius: 8px; text-align: center; display: none; margin: 15px 0; }
    </style>
</head>
<body>
    <div class="login-box">
        <h2>💬 WhatsApp OTP Login</h2>
        <p class="subtitle">SANTRA MALL mein login karo</p>
        
        <div id="step1">
            <input type="text" id="customerName" placeholder="Apna Naam" maxlength="50">
            <input type="text" id="customerPhone" placeholder="Mobile Number (10 digit)" maxlength="10">
            
            <div class="note">
                ⚠️ <b>Note:</b> WhatsApp pe OTP bhejenge. WhatsApp khulne ke baad OTP copy karke yahan daal dena.
            </div>
            
            <button class="btn btn-whatsapp" onclick="sendWhatsAppOTP()">
                📱 WhatsApp pe OTP Bhejo
            </button>
        </div>

        <div id="step2" style="display:none;">
            <p style="text-align:center; color:#25d366; font-weight:bold; margin-bottom:20px;">✅ OTP Bheja Gaya!</p>
            <p style="text-align:center; font-size:14px; color:#666;">WhatsApp check karo aur 6 digit OTP yahan daalo</p>
            <input type="number" id="enteredOTP" placeholder="6 Digit OTP" maxlength="6" style="width:100%; padding:12px; margin:8px 0; border:2px solid #eee; border-radius:8px; font-size:15px; text-align:center;">
            <button class="btn btn-pink" onclick="verifyOrderOTP()" style="width:100%; padding:14px; margin:8px 0; border:none; border-radius:8px; font-size:16px; font-weight:bold; cursor:pointer; background:#e91e63; color:white;">
                OTP Verify Karo
            </button>
            <button onclick="goBack()" style="background:#999; margin-top:5px; width:100%; padding:14px; border:none; border-radius:8px; font-size:16px; font-weight:bold; cursor:pointer; color:white;">← Wapas</button>
        </div>

        <!-- Step 3: Address Bharo -->
        <div id="step3" style="display:none;">
            <h2 style="color:#e91e63; text-align:center;">📦 Delivery Details</h2>
            <p style="text-align:center; color:#10b981; font-weight:bold; margin-bottom:20px;">OTP Verified ✅ Ab address bharo</p>
            <input type="text" id="customerName" placeholder="Pura Naam *" required style="width:100%; padding:12px; margin:8px 0; border:2px solid #eee; border-radius:8px; font-size:15px;">
            <textarea id="customerAddress" placeholder="Full Address + Pincode *" rows="3" required style="width:100%; padding:12px; margin:8px 0; border:2px solid #eee; border-radius:8px; font-size:15px;"></textarea>
            <button class="btn btn-pink" onclick="placeFinalOrder()" style="width:100%; padding:14px; margin:8px 0; border:none; border-radius:8px; font-size:16px; font-weight:bold; cursor:pointer; background:#e91e63; color:white;">
                Order Place Karo - COD
            </button>
        </div>
    </div>

<script>
const ADMIN_WHATSAPP = "919001654667"; // Tera WhatsApp number

// Page load hote hi cart dikhao
window.onload = function() {
    let cartData = localStorage.getItem('santraCart');
    let summary = document.getElementById('cartSummary');
    
    if(!cartData || cartData === 'null' || cartData === '[]') {
        summary.innerHTML = '<b>Cart khaali hai!</b><br><a href="index.html" style="color:#e91e63;">Shopping karo</a>';
        document.getElementById('customerPhone').style.display = 'none';
        document.querySelector('.btn-whatsapp').style.display = 'none';
        return;
    }
    
    let cart = JSON.parse(cartData);
    let html = '<b>Your Order:</b><br><br>';
    let total = 0;
    
    cart.forEach(item => {
        html += `
            <div style="display:flex; justify-content:space-between; margin:6px 0; font-size:13px;">
                <span>${item.name} x ${item.qty}</span>
                <span><b>₹${item.price * item.qty}</b></span>
            </div>
        `;
        total += item.price * item.qty;
    });
    
    html += `<hr style="margin:10px 0;"><div style="display:flex; justify-content:space-between;"><b>Total</b><b>₹${total}</b></div>`;
    summary.innerHTML = html;
}
